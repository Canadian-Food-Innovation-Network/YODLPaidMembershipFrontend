<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make a payment</title>
</head>
<body>

  <!-- Payment button 1 -->
  <div><em><button id="checkout-button-upgrade-1" type="button" class="btn make-buttons">Upgrade to CFIN+</button></em></div>

  <!-- Payment button 2 -->
  <div><em><button id="checkout-button-upgrade-2" type="button" class="btn make-buttons">Upgrade to CFIN+</button></em></div>

  <!-- Payment button 3 -->
  <div><em><button id="checkout-button-upgrade-3" type="button" class="btn make-buttons">Upgrade to CFIN+</button></em></div>

  <script>
    // Function to get URL parameters
    const getUrlParameter = (name) => {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    };

    // Wait until the page is fully loaded
    document.addEventListener('DOMContentLoaded', () => {

      // Get priceId from URL parameters
      const priceIdFromUrl = getUrlParameter('priceId');
      const priceId1 = getUrlParameter('priceId1') || priceIdFromUrl || "price_1ST1pwGw6MO6ihUlDQp5bdg9"; // Default fallback
      const priceId2 = getUrlParameter('priceId2') || priceIdFromUrl || "price_1ST1pwGw6MO6ihUlDQp5bdg9"; // Default fallback
      const priceId3 = getUrlParameter('priceId3') || priceIdFromUrl || "price_1ST1pwGw6MO6ihUlDQp5bdg9"; // Default fallback

      // Get references to all three buttons
      const button1 = document.getElementById('checkout-button-upgrade-1');
      const button2 = document.getElementById('checkout-button-upgrade-2');
      const button3 = document.getElementById('checkout-button-upgrade-3');

      // Initial text for the buttons
      const textButton1 = "Upgrade to CFIN+";
      const textButton2 = "Upgrade to CFIN+";
      const textButton3 = "Upgrade to CFIN+";

      // Set the initial text for all buttons
      button1.textContent = textButton1;
      button2.textContent = textButton2;
      button3.textContent = textButton3;

      // Function to enable a button and set its label
      const EnableButton = (button, label) => {
        button.disabled = false;
        button.textContent = label;
      };

      // Function to disable a button and show "Processing..."
      const DisableButton = (button) => {
        button.disabled = true;
        button.textContent = "Processing...";
      };

      // Helper to disable all buttons except the one clicked
      const disableOtherButtons = (clicked, others) => {
        others.forEach(btn => btn.disabled = true);
      };

      // Event listener for the $1 payment button
      button1.addEventListener('click', function () {
        const button = this;
        DisableButton(button);
        disableOtherButtons(button, [button2, button3]);

        const authToken = document.cookie.split('; ').find(c => c.startsWith('HLAuthToken='))?.split('=')[1];
        if (authToken) {
          const userData = {
            authToken: authToken,
            priceId: priceId1, // Use priceId1 from URL parameter or default
            locale: document.documentElement.lang || "en",
            currentUrl: window.location.href.split('?')[0] // Clean URL without query parameters
          };
          const createCheckoutSessionUrl = 'https://yodlpaidmembership.azurewebsites.net/api/CreateCheckoutSession';
          fetch(createCheckoutSessionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          })
          .then(res => res.json())
          .then(session => {
            if (session.url) {
              window.location.href = session.url;
            } else {
              EnableButton(button, textButton1);
              EnableButton(button2, textButton2);
              EnableButton(button3, textButton3);
            }
          })
          .catch(err => {
            EnableButton(button, textButton1);
            EnableButton(button2, textButton2);
            EnableButton(button3, textButton3);
          });
        }
      });

      // Event listener for the $5 payment button
      button2.addEventListener('click', function () {
        const button = this;
        DisableButton(button);
        disableOtherButtons(button, [button1, button3]);

        const authToken = document.cookie.split('; ').find(c => c.startsWith('HLAuthToken='))?.split('=')[1];
        if (authToken) {
          const userData = {
            authToken: authToken,
            priceId: priceId2, // Use priceId2 from URL parameter or default
            locale: document.documentElement.lang || "en",
            currentUrl: window.location.href.split('?')[0] // Clean URL without query parameters
          };
          const createCheckoutSessionUrl = 'https://yodlpaidmembership.azurewebsites.net/api/CreateCheckoutSession';
          fetch(createCheckoutSessionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          })
          .then(res => res.json())
          .then(session => {
            if (session.url) {
              window.location.href = session.url;
            } else {
              EnableButton(button, textButton2);
              EnableButton(button1, textButton1);
              EnableButton(button3, textButton3);
            }
          })
          .catch(err => {
            EnableButton(button, textButton2);
            EnableButton(button1, textButton1);
            EnableButton(button3, textButton3);
          });
        }
      });

      // Event listener for the $10 payment button
      button3.addEventListener('click', function () {
        const button = this;
        DisableButton(button);
        disableOtherButtons(button, [button1, button2]);

        const authToken = document.cookie.split('; ').find(c => c.startsWith('HLAuthToken='))?.split('=')[1];
        if (authToken) {
          const userData = {
            authToken: authToken,
            priceId: priceId3, // Use priceId3 from URL parameter or default
            locale: document.documentElement.lang || "en",
            currentUrl: window.location.href.split('?')[0] // Clean URL without query parameters
          };
          const createCheckoutSessionUrl = 'https://yodlpaidmembership.azurewebsites.net/api/CreateCheckoutSession';
          fetch(createCheckoutSessionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
          })
          .then(res => res.json())
          .then(session => {
            if (session.url) {
              window.location.href = session.url;
            } else {
              EnableButton(button, textButton3);
              EnableButton(button1, textButton1);
              EnableButton(button2, textButton2);
            }
          })
          .catch(err => {
            EnableButton(button, textButton3);
            EnableButton(button1, textButton1);
            EnableButton(button2, textButton2);
          });
        }
      });
      // Register Plus Opt-Out
      if (document.referrer == 'https://checkout.stripe.com/') {
        // Extract the HLAuthToken from the browser cookies
        const authToken = document.cookie.split('; ').find(c => c.startsWith('HLAuthToken='))?.split('=')[1];
        // Only proceed if we found a valid authToken
        if (authToken) {
          // User data required to register Plus Opt-Out
          const userData = {
            authToken: authToken
          };

          // URL of the backend endpoint that register Plus Opt-Out
          // This should point to your server-side API
          const registerPlusOptOutUrl = 'https://yodlpaidmembership.azurewebsites.net/api/RegisterPlusOptOut';

          // Send POST request to backend to register Plus Opt-Out
          fetch(registerPlusOptOutUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(userData)
          });
        }
      }
    });
  </script>

</body>
</html>
