<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make a payment</title>
</head>
<body>

  <!-- Button -->
  <div><em><button id="checkout-button" type="button" class="btn make-buttons">Pay $199</button></em></div>

  <script src="https://js.stripe.com/v3/ "></script>
  <script>
    document.getElementById('checkout-button').addEventListener('click', function () {
      // Extract the HLAuthToken from the browser cookies
      const authToken = document.cookie.split('; ').find(c => c.startsWith('HLAuthToken='))?.split('=')[1];
      // Hardcoded HLIAMKey required for authentication with the API
      const iamKey = '0e6106a1-7a50-cbc8-f791-60852b4dd769';
      // Only proceed if we found a valid authToken
      if (authToken) {
        // Prepare headers for the fetch request
        const headers = {
          'Content-Type': 'application/json',
          'HLIAMKey': iamKey,       // Authentication key required by the API
          'HLAuthToken': authToken   // Auth token used to identify the user session
        };

        // Make a GET request to the GetWhoAmI endpoint
        fetch('https://api.connectedcommunity.org/api/v2.0/Contacts/GetWhoAmI ', {
          method: 'GET',
          headers: headers
        })
        .then(response => {
          // If response is OK (status 200-299), parse JSON response
          if (response.ok) {
            return response.json();
          }
          // Else, do nothing (no handling needed for errors at this stage)
        })
        .then(data => {
          // Extract relevant contact info from the response
          const contactKey = data.ContactKey;
          const emailAddress = data.EmailAddress;

          // User data required to create a checkout session
          // This typically includes user identification and authentication details
          const userData = {
            contactKey: contactKey,
            emailAddress: emailAddress,
            authToken: authToken,
            amount: '19900',
            currency: 'cad'
          };

          // URL of the backend endpoint that creates a Stripe Checkout Session
          // This should point to your server-side API
          const createCheckoutSessionUrl = 'https://yodlpaidmembershipuat.azurewebsites.net/api/CreateCheckoutSession';

          // Send POST request to backend to create a new checkout session
          fetch(createCheckoutSessionUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(userData)
          })
          // Parse the response as JSON
          .then(res => res.json())
          .then(session => {
            // Load Stripe.js using your publishable key
            const stripePublicKey = 'pk_test_51REWdDGfJJQlVOB8jMf8f5D02qovpC790QOHz7vMNkrJvYqcBQrIRASIfqTt4htKYqQ1mCYR8bdJr4DWDdWf4BT600pUuhURBT';
            const stripe = Stripe(stripePublicKey);

            // Redirect the user to the Stripe Checkout page with the session ID
            return stripe.redirectToCheckout({ sessionId: session.id });
          })
          // Handle any errors during the fetch or redirect process
          .catch(err => {
            // Catch and ignore any network or fetch errors (no action required)
          });
        })
        .catch(error => {
          // Catch and ignore any network or fetch errors (no action required)
        });
      }
    });
  </script>

</body>
</html>
