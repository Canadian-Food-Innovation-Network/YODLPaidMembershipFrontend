<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Make a payment</title>
</head>
<body>

  <!-- Button -->
  <div><em><button id="checkout-button" type="button" class="btn make-buttons">Pay $1</button></em></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const EnableButton = (button) => {
        button.disabled = false;
        button.textContent = "Pay $1";
      };

      const DisableButton = (button) => {
        button.disabled = true;
        button.textContent = "Processing...";
      };

      document.getElementById('checkout-button').addEventListener('click', function () {
        // Disable the button to prevent multiple clicks 
        const button = this;
        DisableButton(button);
        // Extract the HLAuthToken from the browser cookies
        const authToken = document.cookie.split('; ').find(c => c.startsWith('HLAuthToken='))?.split('=')[1];
        // Only proceed if we found a valid authToken
        if (authToken) {
          // User data required to create a checkout session
          const userData = {
            authToken: authToken,
            priceId: "price_1REX4mGfJJQlVOB8jzxq4sIe", // Price ID for the product being purchased UAT
            locale: document.documentElement.lang || "en"
          };

          // URL of the backend endpoint that creates a Stripe Checkout Session
          // This should point to your server-side API
          const createCheckoutSessionUrl = 'https://yodlpaidmembershipuat.azurewebsites.net/api/CreateCheckoutSessionUAT';

          // Send POST request to backend to create a new checkout session
          fetch(createCheckoutSessionUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(userData)
          })
          // Parse the response as JSON
          .then(res => res.json())
          .then(session => {
            // Redirect directly to the URL received from the backend
            if (session.url) {
              window.location.href = session.url;
            } else {
              return EnableButton(button);
            }
          })
          // Handle any errors during the fetch or redirect process
          .catch(err => {
            // Re-enable the button if there's an error
            return EnableButton(button);
          });
        }
      });  
    });  
  </script>

</body>
</html>
